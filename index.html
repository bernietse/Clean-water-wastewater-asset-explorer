<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Water &amp; Wastewater Asset Explorer</title>
<style>
  :root{
    --bg:#0B1520;
    --panel:#12233A;
    --panel-alt:#17304D;
    --line:#22405F;
    --cw:#5FC2D0;
    --cw-dim:#2E5560;
    --ww:#C2793E;
    --ww-dim:#5A4530;
    --text:#EAF1F5;
    --muted:#7E93A8;
    --good:#6FCF97;
    --fair:#E8B04B;
    --poor:#DD5C46;
    --mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{min-height:100vh;}
  header{
    padding:28px 32px 20px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0D1826,#0B1520);
  }
  header .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--muted);
    text-transform:uppercase;
  }
  header h1{
    margin:6px 0 6px;
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:13.5px;
    max-width:640px;
    line-height:1.5;
  }
  .legend{
    display:flex;
    gap:20px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .legend span{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
  }
  .stream{
    padding:26px 24px 60px;
    position:relative;
  }
  .stream.clean{border-right:1px solid var(--line);}
  .stream-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:22px;
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .stream-head h2{
    font-size:15px;
    margin:0;
    font-weight:600;
  }
  .stream-head .tag{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--muted);
  }
  .pipe{
    position:relative;
    padding-left:26px;
  }
  .pipe::before{
    content:'';
    position:absolute;
    left:9px;
    top:6px;
    bottom:6px;
    width:2px;
  }
  .clean .pipe::before{background:linear-gradient(180deg,var(--cw),var(--cw-dim));}
  .waste .pipe::before{background:linear-gradient(180deg,var(--ww),var(--ww-dim));}
  .stage{
    position:relative;
    margin-bottom:10px;
  }
  .stage::before{
    content:'';
    position:absolute;
    left:-26px;
    top:14px;
    width:9px;
    height:9px;
    border-radius:50%;
    border:2px solid var(--bg);
  }
  .clean .stage::before{background:var(--cw);}
  .waste .stage::before{background:var(--ww);}
  .stage-btn{
    width:100%;
    text-align:left;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 14px;
    color:var(--text);
    cursor:pointer;
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    transition:border-color .15s,background .15s;
  }
  .stage-btn:hover{border-color:var(--cw);}
  .waste .stage-btn:hover{border-color:var(--ww);}
  .stage-btn .lbl{display:flex;flex-direction:column;gap:2px;}
  .stage-btn .code{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em;}
  .stage-btn .name{font-size:13.5px;font-weight:500;}
  .stage-btn .chev{color:var(--muted);font-size:12px;transition:transform .18s;flex-shrink:0;}
  .stage.open .stage-btn .chev{transform:rotate(90deg);}
  .stage.open .stage-btn{background:var(--panel-alt);}
  .assets{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
    padding-left:4px;
  }
  .stage.open .assets{max-height:600px;}
  .asset-chip{
    display:flex;
    align-items:center;
    gap:8px;
    width:calc(100% - 4px);
    text-align:left;
    background:transparent;
    border:none;
    border-left:2px solid var(--line);
    padding:9px 10px 9px 14px;
    margin-top:2px;
    color:var(--muted);
    cursor:pointer;
    font-family:var(--sans);
    font-size:12.8px;
    transition:color .15s,border-color .15s,background .15s;
  }
  .asset-chip:hover{color:var(--text);background:rgba(255,255,255,0.03);}
  .clean .asset-chip:hover{border-color:var(--cw);}
  .waste .asset-chip:hover{border-color:var(--ww);}
  .asset-chip.active{color:var(--text);background:rgba(255,255,255,0.05);}
  .clean .asset-chip.active{border-color:var(--cw);}
  .waste .asset-chip.active{border-color:var(--ww);}
  .asset-chip .achip-code{font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0;}

  #overlay{
    position:fixed;inset:0;
    background:rgba(4,9,16,0.55);
    opacity:0;pointer-events:none;
    transition:opacity .2s;
    z-index:40;
  }
  #overlay.show{opacity:1;pointer-events:auto;}

  #drawer{
    position:fixed;
    top:0;right:0;
    width:420px;
    max-width:92vw;
    height:100vh;
    background:var(--panel);
    border-left:1px solid var(--line);
    transform:translateX(100%);
    transition:transform .25s ease;
    z-index:41;
    overflow-y:auto;
    padding:26px 26px 60px;
  }
  #drawer.show{transform:translateX(0);}
  #drawer .close-btn{
    position:absolute;top:20px;right:20px;
    background:none;border:1px solid var(--line);
    color:var(--muted);width:30px;height:30px;border-radius:6px;
    cursor:pointer;font-size:15px;line-height:1;
  }
  #drawer .close-btn:hover{color:var(--text);border-color:var(--muted);}
  #drawer .d-code{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;}
  #drawer .d-title{font-size:19px;font-weight:600;margin:6px 0 2px;padding-right:40px;}
  #drawer .d-stage{font-size:12.5px;color:var(--muted);margin-bottom:18px;}
  #drawer .d-stage b{color:var(--text);font-weight:500;}
  #drawer .d-section{margin-bottom:20px;}
  #drawer .d-section h4{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 8px;
    font-weight:500;
  }
  #drawer .d-section p{margin:0;font-size:13.5px;line-height:1.65;color:var(--text);}
  #drawer .d-section ul{margin:0;padding-left:18px;}
  #drawer .d-section li{font-size:13.5px;line-height:1.6;margin-bottom:5px;color:var(--text);}
  .cond-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
  .pill{
    font-family:var(--mono);
    font-size:10.5px;
    padding:4px 9px;
    border-radius:999px;
    background:var(--panel-alt);
    border:1px solid var(--line);
    color:var(--muted);
  }
  #drawer .am-box{
    background:var(--panel-alt);
    border-left:2px solid var(--cw);
    border-radius:0 6px 6px 0;
    padding:12px 14px;
  }
  .waste-active #drawer .am-box{border-left-color:var(--ww);}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .stream.clean{border-right:none;border-bottom:1px solid var(--line);}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Asset Management Reference</div>
  <h1>Clean water &amp; wastewater asset explorer</h1>
  <p>Click a stage to open it up, then click an asset to see what it does, its key components, common failure modes, and what an asset management specialist watches for.</p>
  <div class="legend">
    <span><span class="dot" style="background:var(--cw)"></span>Clean water (source to tap)</span>
    <span><span class="dot" style="background:var(--ww)"></span>Wastewater (drain to discharge)</span>
  </div>
</header>

<div class="layout" id="layout"></div>

<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <button class="close-btn" onclick="closeDrawer()">&times;</button>
  <div id="drawer-content"></div>
</div>

<script>
const DATA = {
  clean: {
    label: "Clean water network",
    tag: "potable supply",
    stages: [
      {
        code: "CW-1", name: "Source & abstraction",
        assets: [
          { code:"A1", name:"Impounding reservoir",
            what:"An upland raw-water reservoir formed by a dam, storing rainfall runoff for later treatment. Acts as the strategic buffer against drought and seasonal variation in river flow.",
            components:["Dam / embankment","Draw-off tower and valves","Spillway","Raw water intake screens"],
            failures:["Dam structural deterioration or seepage","Sedimentation reducing usable capacity","Algal blooms affecting raw water quality","Drawdown outlet blockage"],
            am:"Dams are high-consequence assets — failure risk (reservoir safety under the Reservoirs Act) usually outweighs simple condition scoring. Expect inspection regimes driven by statutory reservoir panel engineers rather than standard asset renewal cycles.",
            condition:["Structural","Water quality","Capacity"]
          },
          { code:"A2", name:"Borehole / wellfield",
            what:"A drilled well abstracting groundwater from an aquifer, usually pumped to a treatment works or directly into supply after minor treatment.",
            components:["Borehole casing and screen","Submersible pump","Rising main","Wellhead chamber and telemetry"],
            failures:["Pump wear and efficiency loss","Borehole yield decline (clogging, drawdown)","Saline or nitrate intrusion","Casing corrosion"],
            am:"Yield decline is the key long-term risk indicator — asset teams track abstraction licence headroom against declining aquifer yield and drought vulnerability, not just mechanical condition.",
            condition:["Yield","Water quality","Mechanical"]
          },
          { code:"A3", name:"River intake",
            what:"A direct abstraction point on a river or watercourse, drawing raw water through screens into the treatment process, often licensed with minimum residual flow conditions.",
            components:["Coarse and fine screens","Intake pumps","Fish protection screening","Flow measurement"],
            failures:["Screen blinding from debris","Pump cavitation at low river levels","Silt ingress","Abstraction licence non-compliance at low flow"],
            am:"Highly exposed to climate and catchment risk. Specialists track abstraction licence constraints and drought-order sensitivity as much as physical asset condition.",
            condition:["Screening","Flow reliability","Licence headroom"]
          }
        ]
      },
      {
        code: "CW-2", name: "Water treatment works (WTW)",
        assets: [
          { code:"A1", name:"Screening & pre-treatment",
            what:"The first treatment stage, removing coarse debris, grit and larger particulates before chemical dosing begins.",
            components:["Coarse and fine screens","Grit channels","Pre-chlorination dosing (where used)"],
            failures:["Screen mechanism jamming","Debris carryover into downstream process","Motor and drive wear"],
            am:"Low individual criticality but a failure here cascades downstream, so specialists weight it by knock-on risk to the whole works rather than standalone value.",
            condition:["Mechanical","Throughput"]
          },
          { code:"A2", name:"Coagulation & flocculation",
            what:"Chemicals (typically ferric or aluminium salts) are dosed and mixed to clump fine particles and organic matter into larger flocs that can be settled or filtered out.",
            components:["Dosing pumps and chemical storage","Rapid mix chamber","Flocculation tanks with slow-stirring paddles"],
            failures:["Dosing pump failure or miscalibration","Chemical supply disruption","Poor floc formation from raw water quality shifts"],
            am:"Process-critical: get this wrong and every downstream stage underperforms. Asset management here overlaps heavily with process control — condition data is often paired with water quality performance data.",
            condition:["Dosing accuracy","Mechanical","Process performance"]
          },
          { code:"A3", name:"Clarification",
            what:"Settles or floats out the flocculated solids, using gravity sedimentation tanks or dissolved air flotation (DAF), producing clarified water for filtration.",
            components:["Settlement tanks / DAF cells","Sludge scrapers or DAF saturation system","Sludge draw-off"],
            failures:["Scraper mechanism wear","Sludge blanket carryover","Short-circuiting reducing settlement efficiency"],
            am:"Structural concrete tanks have long design lives (50+ years) but mechanical internals (scrapers, DAF plant) are on much shorter renewal cycles — the two need separate asset registers within the same structure.",

          { code:"A4", name:"Filtration",

            failures:["Media clogging (mudballing)","Underdrain damage","Backwash system failure leading to breakthrough"],
            am:"Media condition surveys (coring, UDF checks) are a distinct inspection regime from the civil structure. Backwash system reliability is often the single biggest driver of unplanned works downtime.",
            condition:["Media condition","Mechanical (backwash)","Structural"]

          { code:"A5", name:"Disinfection",
            what:"Final barrier against pathogens before water enters supply — most commonly chlorination, sometimes supplemented with UV disinfection.",
            components:["Chlorine dosing/gas or hypochlorite system","Contact tank","UV reactors (where fitted)","Residual chlorine monitors"],
            failures:["Dosing equipment failure (critical — direct public health risk)","Contact time shortfall","UV lamp fouling or failure"],
            am:"This is the highest-consequence asset class in the whole clean water chain — failure has direct, immediate public health implications (DWI reportable). Redundancy and alarm/telemetry reliability are prioritised well above normal cost-benefit renewal logic.",
            condition:["Dosing reliability","Residual monitoring","Redundancy"]
          }
        ]
      },
      {
        code: "CW-3", name: "Treated water storage",
        assets: [
          { code:"A1", name:"Service reservoir",

            components:["Reservoir chambers/cells","Roof and access covers","Inlet/outlet penstocks","Overflow and washout"],
            failures:["Roof or wall leakage","Ingress of contamination through poor covers or vents (DWI major concern)","Valve seizure"],
            am:"Integrity and security against ingress is the number one asset management concern — a breach is a direct water quality incident. CCTV/dive surveys of reservoir condition are a standard specialist inspection tool.",
            condition:["Structural integrity","Water tightness","Security/ingress risk"]
          },
          { code:"A2", name:"Water tower",
            what:"An elevated storage tank providing gravity-fed pressure to a local distribution zone, often in areas with limited natural elevation.",
            components:["Elevated tank","Support structure","Riser main and valves"],
            failures:["Structural steel/concrete deterioration","Riser main corrosion","Tank leakage"],
            am:"Ageing assets in the UK stock — many date from early-to-mid 20th century. Structural condition surveys and end-of-life replacement planning are a recurring AMP investment theme.",
            condition:["Structural","Water tightness"]
          }
        ]
      },
      {
        code: "CW-4", name: "Distribution network",
        assets: [
          { code:"A1", name:"Trunk main",

            components:["Pipe (typically ductile iron, steel or PE)","Air valves","Isolation valves","Washouts"],
            failures:["Bursts (high consequence given diameter/pressure)","Corrosion (older cast iron/steel)","Joint failure"],
            am:"High-consequence-of-failure assets even at moderate probability, because a trunk main burst can cut supply to large populations. Prioritised using risk = probability × consequence rather than condition alone.",

            failures:["Leakage (major UK performance metric)","Bursts","Discolouration from internal corrosion"],
            am:"Leakage performance here is one of Ofwat's headline regulatory metrics. Asset management blends pipe age/material risk modelling with active leak detection and DMA (district meter area) flow monitoring.",

          },
          { code:"A3", name:"Water pumping station",
            what:"Booster pumping station that raises pressure to move water through the network or into elevated storage/zones with insufficient gravity head.",
            components:["Pumps and motors","Control panel/telemetry","Pressure-relief valves"],
            failures:["Pump wear/efficiency loss","Power supply interruption","Control system failure"],
            am:"Mechanical/electrical assets have much shorter renewal cycles (15–25 years) than the civil structure housing them — kept on separate asset registers with different investment triggers.",
            condition:["Mechanical","Electrical","Energy efficiency"]

          { code:"A4", name:"Pressure reducing valve (PRV)",
            what:"Automatically reduces water pressure entering a zone to protect the network and properties from excess pressure, which drives leakage and bursts.",

            failures:["Valve sticking (fail open or fail closed)","Chamber flooding","Loss of telemetry visibility"],
            am:"A well-maintained PRV directly reduces leakage and burst frequency downstream — high leverage, low unit cost, making it a favourite target for proactive rather than reactive maintenance.",

            components:["Hydrant valve and riser","Surface box/cover"],
            failures:["Seized or leaking valve","Damaged surface box (trip hazard, ingress risk)"],

          }
        ]
      },
      {
        code: "CW-5", name: "Customer connection",

            components:["Communication pipe","Boundary stop tap","Customer supply pipe"],
            failures:["Leakage (a major source of 'customer-side' leakage)","Lead pipe material (health concern in older stock)","Frost damage"],
            am:"Ownership boundary matters hugely for asset management responsibility and investment — lead pipe replacement programmes are a specific regulatory and public health priority distinct from company-owned main renewal.",

          },
          { code:"A2", name:"Customer meter",
            what:"Measures water consumption at the property, increasingly smart/AMR (automated meter reading) enabled for near real-time usage data.",
            components:["Meter body","Meter chamber/boundary box","AMR telemetry unit (where fitted)"],
            failures:["Under-registration as meters age (revenue loss)","Chamber flooding/access issues","Communication failure in smart meters"],
            am:"Smart meter rollout is a live AMP8 investment theme — enabling leak detection at the customer end and more accurate demand forecasting, both core to asset management planning.",
            condition:["Accuracy/age","Telemetry connectivity"]
          }
        ]
      }
    ]
  },
  waste: {
    label: "Wastewater network",
    tag: "drain to discharge",
    stages: [
      {
        code: "WW-1", name: "Collection network",
        assets: [
          { code:"A1", name:"Foul sewer",
            what:"Underground pipe carrying only wastewater from properties (toilets, sinks, appliances) to treatment, separate from rainwater.",
            components:["Pipe (clay, concrete, PE, etc.)","Connections/laterals","Manholes"],
            failures:["Root ingress","Structural collapse","Blockage from fats, oils, grease (FOG) or wipes"],

          { code:"A2", name:"Combined sewer",

          { code:"A3", name:"Surface water sewer",

      },
      {
        code: "WW-2", name: "Conveyance",

            components:["Wet well","Pumps (typically submersible)","Control kiosk/telemetry","Emergency storage/overflow"],
            failures:["Pump blockage (rags, wipes)","Power failure without adequate backup","Wet well structural deterioration","High-level alarm/telemetry failure"],
            am:"One of the highest-volume causes of pollution incidents and flooding when they fail — telemetry reliability and emergency response time are tracked as closely as physical asset condition. Often has bespoke criticality scoring reflecting downstream flood/pollution consequence.",

          { code:"A2", name:"Rising main (force main)",

      {

            failures:["Embankment erosion or seepage","Silt build-up reducing storage volume","Vegetation blocking inlet/outlet"],

const layout = document.getElementById('layout');
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');
const drawerContent = document.getElementById('drawer-content');

function buildStream(key, data, cls){
  const streamEl = document.createElement('div');
  streamEl.className = 'stream ' + cls;
  const head = document.createElement('div');
  head.className = 'stream-head';
  head.innerHTML = `<h2>${data.label}</h2><span class="tag">${data.tag}</span>`;
  streamEl.appendChild(head);

  const pipe = document.createElement('div');
  pipe.className = 'pipe';

  data.stages.forEach((stage, si) => {
    const stageEl = document.createElement('div');
    stageEl.className = 'stage';
    stageEl.id = `${key}-stage-${si}`;

    const btn = document.createElement('button');
    btn.className = 'stage-btn';
    btn.innerHTML = `<span class="lbl"><span class="code">${stage.code}</span><span class="name">${stage.name}</span></span><span class="chev">&rsaquo;</span>`;
    btn.onclick = () => toggleStage(stageEl);
    stageEl.appendChild(btn);

    const assetsEl = document.createElement('div');
    assetsEl.className = 'assets';
    stage.assets.forEach((asset, ai) => {
      const chip = document.createElement('button');
      chip.className = 'asset-chip';
      chip.id = `${key}-chip-${si}-${ai}`;
      chip.innerHTML = `<span class="achip-code">${stage.code}.${asset.code}</span><span>${asset.name}</span>`;
      chip.onclick = (e) => {
        e.stopPropagation();
        openAsset(key, stage, asset, chip);
      };
      assetsEl.appendChild(chip);
    });
    stageEl.appendChild(assetsEl);
    pipe.appendChild(stageEl);
  });

  streamEl.appendChild(pipe);
  return streamEl;
}

layout.appendChild(buildStream('clean', DATA.clean, 'clean'));
layout.appendChild(buildStream('waste', DATA.waste, 'waste'));

function toggleStage(stageEl){
  const wasOpen = stageEl.classList.contains('open');
  document.querySelectorAll('.stage.open').forEach(s => { if(s !== stageEl) s.classList.remove('open'); });
  stageEl.classList.toggle('open', !wasOpen);
}

let activeChip = null;
function openAsset(streamKey, stage, asset, chipEl){
  if(activeChip) activeChip.classList.remove('active');
  activeChip = chipEl;
  chipEl.classList.add('active');
  document.body.classList.toggle('waste-active', streamKey === 'waste');

  const condPills = asset.condition.map(c => `<span class="pill">${c}</span>`).join('');
  const compList = asset.components.map(c => `<li>${c}</li>`).join('');
  const failList = asset.failures.map(f => `<li>${f}</li>`).join('');

  drawerContent.innerHTML = `
    <div class="d-code">${stage.code}.${asset.code}</div>
    <div class="d-title">${asset.name}</div>
    <div class="d-stage">Stage: <b>${stage.name}</b> &middot; ${streamKey === 'clean' ? 'Clean water' : 'Wastewater'}</div>

    <div class="d-section">
      <h4>What it is</h4>
      <p>${asset.what}</p>
    </div>

    <div class="d-section">
      <h4>Key components</h4>
      <ul>${compList}</ul>
    </div>

    <div class="d-section">
      <h4>Common failure modes</h4>
      <ul>${failList}</ul>
    </div>

    <div class="d-section">
      <h4>What's monitored</h4>
      <div class="cond-pills">${condPills}</div>
    </div>

    <div class="d-section">
      <h4>Asset management note</h4>
      <div class="am-box"><p>${asset.am}</p></div>
    </div>
  `;

  drawer.classList.add('show');
  overlay.classList.add('show');
}

function closeDrawer(){
  drawer.classList.remove('show');
  overlay.classList.remove('show');
  if(activeChip){ activeChip.classList.remove('active'); activeChip = null; }
}

document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeDrawer(); });
</script>
